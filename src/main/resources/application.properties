# Values come from environment variables. For local development, copy
# .env.example to .env (git-ignored); it is loaded automatically if present.
spring.config.import=optional:file:.env[.properties]

# App
spring.application.name=nursematch-backend
server.port=${SERVER_PORT:8080}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/matchnp}
spring.data.mongodb.database=${MONGODB_DATABASE:matchnp}

# JWT (required - no default; startup fails if unset)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Geocoding (OpenStreetMap Nominatim requires an identifying User-Agent with contact info)
geocoding.base-url=${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org/search}
geocoding.user-agent=${GEOCODING_USER_AGENT:NurseMatch-App/1.0}
